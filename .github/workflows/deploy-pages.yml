name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar versão web
        env:
          # O site fica em https://<usuario>.github.io/<nome-do-repositorio>/
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web
          # O GitHub Pages usa 404.html como página de erro.
          cp dist/+not-found.html dist/404.html
          # Evita que o Jekyll ignore a pasta _expo.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
